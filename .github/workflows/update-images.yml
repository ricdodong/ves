name: Update Image List

on:
  push:
    paths:
      - 'imgslide/**'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate image list JSON
        run: |
          cd imgslide
          jq -n '[inputs]' < <(find . -maxdepth 1 \( -name "*.jpg" -o -name "*.jpeg" -o -name "*.png" -o -name "*.webp" -o -name "*.jfif" \) -printf "%f\n" | sort) > ../images.json
          cd ..

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add images.json
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto-update image list [skip ci]" && git push)
