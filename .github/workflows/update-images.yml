name: Update Image List

on:
  push:
    paths:
      - 'imgslide/**'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate image list JSON
        run: |
          python3 -c '
          import os, json
          img_dir = "imgslide"
          extensions = (".jpg", ".jpeg", ".png", ".webp", ".jfif")
          if os.path.exists(img_dir):
              files = sorted([f for f in os.listdir(img_dir) if f.lower().endswith(extensions)])
          else:
              files = []
          with open("images.json", "w") as f:
              json.dump(files, f, indent=2)
          '

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add images.json
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto-update image list [skip ci]" && git push)
